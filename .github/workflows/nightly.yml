name: Nightly browser suite
run-name: ${{ inputs.verification_id || 'Nightly browser suite' }}

# The whole browser suite (about 20 minutes), and the unit tests' coverage:
# every night, and by hand from the Actions tab. Pushes and pull requests run
# ci.yml's smoke tests instead.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      verification_id:
        description: Correlates a fixer verification run with its dispatch
        type: string
        required: false

permissions:
  contents: read

# Each action is pinned to the commit its release tag named when it was
# chosen: a tag can be moved to other code, a commit cannot.

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # The suite launches Chromium headless (new headless mode loads extensions),
      # so no virtual display is needed.
      - name: Browser suite
        run: npx playwright test --grep-invert "throughput benchmark"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  # Which lines of src/ the unit tests reach, by file, in the run's log and
  # as an lcov file to download. A report, not a gate.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Unit test coverage
        run: npm run coverage -- --test-timeout=120000 --test-coverage-include="src/**" --test-reporter=spec --test-reporter-destination=stdout --test-reporter=lcov --test-reporter-destination=lcov.info
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage
          path: lcov.info
          if-no-files-found: ignore
